<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Night Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060f;
    --panel: rgba(14, 20, 40, 0.92);
    --border: rgba(120, 150, 255, 0.18);
    --text: #e6ebff;
    --muted: #8c97c0;
    --accent: #ffd36e;
    --accent2: #7aa2ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); }

  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px; padding: 16px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  #skyCard { position: relative; }
  #sky {
    display: block; width: 100%; aspect-ratio: 1 / 1;
    max-height: 82vh; touch-action: none; cursor: grab;
    background: radial-gradient(circle at center, #0b1330 0%, #04060f 70%);
  }
  #sky:active { cursor: grabbing; }

  .searchbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .searchbar input {
    flex: 1; min-width: 180px; background: #0b1230; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px;
  }
  .searchbar input:focus { outline: 2px solid var(--accent2); }
  #searchMsg { font-size: 13px; color: var(--muted); width: 100%; }
  #searchMsg b { color: var(--accent); }
  #searchMsg button { margin-left: 6px; padding: 4px 10px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 14px; border-top: 1px solid var(--border);
  }
  .controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .viewmodes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px 0 14px; font-size: 13px; color: var(--muted); }
  .viewmodes label { display: flex; align-items: center; gap: 5px; background: #121a3a; border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; cursor: pointer; color: var(--text); }
  .viewmodes label:has(input:checked) { background: #24326a; border-color: var(--accent2); }
  .viewmodes input { accent-color: var(--accent); margin: 0; }
  button {
    background: #1a2550; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #24326a; }
  input[type=range] { width: 160px; accent-color: var(--accent); }
  #timeLabel { font-size: 13px; color: var(--accent); min-width: 150px; }

  #info {
    position: absolute; top: 104px; left: 12px; max-width: 260px; z-index: 2;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
    display: none;
  }
  #info h3 { color: var(--accent); font-size: 15px; margin-bottom: 4px; }
  #info .close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }

  .legend { position: absolute; top: 104px; right: 14px; font-size: 11px; color: var(--muted); text-align: right; pointer-events: none; }

  #apod { display: flex; flex-direction: column; }
  #apod .head { padding: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  #apod .head h2 { font-size: 15px; }
  #apod input[type=date] {
    background: #1a2550; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; color-scheme: dark;
  }
  #apodBody { padding: 14px; overflow-y: auto; max-height: 75vh; }
  #apodBody img, #apodBody iframe { width: 100%; border-radius: 10px; border: 0; margin-bottom: 10px; }
  #apodBody iframe { aspect-ratio: 16 / 9; }
  #apodBody h3 { font-size: 16px; margin-bottom: 4px; }
  #apodBody .meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #apodBody p { font-size: 13px; line-height: 1.6; color: #c9d1f2; }
  .err { color: #ff8f8f; font-size: 13px; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 10px 16px 20px; }
  footer a { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <h1>✦ Galaxy <span>Night Sky</span></h1>
  <div id="status">Loading the real star catalogue…</div>
</header>

<main>
  <section class="card" id="skyCard">
    <div class="searchbar">
      <input id="searchBox" list="skyNames" placeholder="🔍 Search a star, planet or constellation — e.g. Jupiter, Moon, Sirius, Orion" autocomplete="off">
      <datalist id="skyNames"></datalist>
      <button id="searchBtn">Find</button>
      <button id="clearSearch" title="Clear highlight">✕</button>
      <div id="searchMsg">Type a name and press Enter.</div>
    </div>
    <canvas id="sky"></canvas>

    <div id="info">
      <button class="close" onclick="hideInfo()">✕</button>
      <div id="infoBody"></div>
    </div>

    <div class="legend">N at top · E on left<br>Drag to move · scroll / pinch to zoom · tap a star</div>

    <div class="viewmodes" id="viewModes">
      <span>Show:</span>
      <label><input type="radio" name="viewMode" value="all" checked> Everything</label>
      <label><input type="radio" name="viewMode" value="planets"> Planets, Sun &amp; Moon only</label>
      <label><input type="radio" name="viewMode" value="stars"> Stars only</label>
      <label><input type="radio" name="viewMode" value="constellations"> Constellations</label>
      <label><input type="radio" name="viewMode" value="custom"> Custom</label>
    </div>
    <div class="controls">
      <button id="nowBtn">Now</button>
      <input type="range" id="timeSlider" min="-720" max="720" value="0" step="5" title="Hours from now">
      <span id="timeLabel"></span>
      <button id="playBtn">▶ Play</button>
      <label><input type="checkbox" id="showStars" checked> Stars</label>
      <label><input type="checkbox" id="showLines" checked> Constellations</label>
      <label><input type="checkbox" id="showNames" checked> Names</label>
      <label><input type="checkbox" id="showPlanets" checked> Planets, Sun &amp; Moon</label>
      <button id="resetView">Reset view</button>
      <button id="shotBtn">📷 Save picture</button>
    </div>
  </section>

  <aside class="card" id="apod">
    <div class="head">
      <h2>NASA Picture of the Day</h2>
      <input type="date" id="apodDate">
    </div>
    <div id="apodBody">Loading…</div>
  </aside>
</main>

<footer>
  Star data: <a href="https://github.com/ofrohn/d3-celestial" target="_blank" rel="noopener">d3-celestial</a> (Hipparcos catalogue) ·
  Photos: <a href="https://apod.nasa.gov" target="_blank" rel="noopener">NASA APOD</a>
</footer>

<script>
// ===================== SETTINGS =====================
const NASA_API_KEY = "gmYU6Y7vRUCRk0OxAk6QmqFyfE24NZbXIPovyycV";
const DEFAULT_LOCATION = { lat: 12.97, lon: 77.59, name: "Bengaluru" }; // used if location is not allowed
const DATA = "https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/";

// ===================== STATE =====================
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let stars = [], lines = [], conNames = [], starNames = {};
let place = { ...DEFAULT_LOCATION };
let minutesOffset = 0, playing = false;
let view = { scale: 1, x: 0, y: 0 };
let drawn = []; // stars drawn on screen, for tapping
let drawnBodies = []; // planets, Sun & Moon drawn on screen
let isDaytime = false;

const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;

// ===================== ASTRONOMY =====================
function currentTime() { return new Date(Date.now() + minutesOffset * 60000); }

function localSiderealDeg(date, lonDeg) {
  const jd = date.getTime() / 86400000 + 2440587.5;
  const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0);
  return ((gmst + lonDeg) % 360 + 360) % 360;
}

// RA/Dec (degrees) -> altitude/azimuth (degrees). Azimuth: 0 = North, 90 = East.
function toHorizon(raDeg, decDeg, lst, latDeg) {
  const ha = rad(lst - raDeg), dec = rad(decDeg), lat = rad(latDeg);
  const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
  const alt = Math.asin(sinAlt);
  const az = Math.atan2(-Math.sin(ha) * Math.cos(dec),
                        Math.cos(lat) * Math.sin(dec) - Math.sin(lat) * Math.cos(dec) * Math.cos(ha));
  return { alt: deg(alt), az: (deg(az) + 360) % 360 };
}

// Dome projection: overhead in the centre, horizon at the edge, north up, east left.
function project(alt, az, size) {
  const R = size * 0.47 * view.scale;
  const r = R * Math.tan(rad(90 - alt) / 2); // stereographic
  const cx = size / 2 + view.x, cy = size / 2 + view.y;
  return { x: cx - r * Math.sin(rad(az)), y: cy - r * Math.cos(rad(az)) };
}

function starColour(bv) {
  if (bv == null || isNaN(bv)) return "#ffffff";
  if (bv < 0)   return "#9bb0ff";
  if (bv < 0.3) return "#cad7ff";
  if (bv < 0.6) return "#f8f7ff";
  if (bv < 1.0) return "#fff4e8";
  if (bv < 1.4) return "#ffd2a1";
  return "#ffb56c";
}
function colourName(bv) {
  if (bv == null || isNaN(bv)) return "white";
  if (bv < 0) return "blue-white, very hot";
  if (bv < 0.3) return "white";
  if (bv < 0.6) return "yellow-white";
  if (bv < 1.0) return "yellow, like our Sun";
  if (bv < 1.4) return "orange";
  return "red-orange, cooler";
}
function compass(az) {
  return ["N","NE","E","SE","S","SW","W","NW"][Math.round(az / 45) % 8];
}

// ===================== PLANETS, SUN & MOON =====================
// All positions use the J2000 frame, the same frame as the star catalogue, so planets sit in the right constellation.
// Keplerian elements from JPL "Approximate Positions of the Planets" (valid 1800–2050).
// [a (AU), e, I (deg), L (deg), long.peri (deg), long.node (deg)] and their rates per Julian century.
const PLANET_ELEMENTS = {
  Mercury: [[0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593], [0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081]],
  Venus:   [[0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255], [0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418]],
  Earth:   [[1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0], [0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0]],
  Mars:    [[1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891], [0.00001847, 0.00007882, -0.00813131, 19140.30268499, 0.44441088, -0.29257343]],
  Jupiter: [[5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909], [-0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106]],
  Saturn:  [[9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448], [-0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794]],
  Uranus:  [[19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503], [-0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589]],
  Neptune: [[30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574], [0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664]]
};
const PLANET_STYLE = {
  Sun:     { colour: "#ffd84a", size: 11, fact: "Our own star. Never look at it directly." },
  Moon:    { colour: "#e8e4d8", size: 9,  fact: "Earth's natural satellite, about 384,000 km away." },
  Mercury: { colour: "#c9b8a6", size: 4,  fact: "The smallest planet and the closest to the Sun." },
  Venus:   { colour: "#fff3c4", size: 6,  fact: "The brightest planet, often called the morning or evening star." },
  Mars:    { colour: "#ff7a4d", size: 5,  fact: "The red planet. Its colour comes from iron oxide (rust) dust." },
  Jupiter: { colour: "#f2d3a2", size: 6,  fact: "The largest planet. Binoculars can show its four biggest moons." },
  Saturn:  { colour: "#ead8a0", size: 5,  fact: "Famous for its rings, visible in a small telescope." },
  Uranus:  { colour: "#9fe3e6", size: 3,  fact: "An ice giant tipped on its side. Barely visible without a telescope." },
  Neptune: { colour: "#7f9cff", size: 3,  fact: "The farthest planet. Needs a telescope to see." }
};
const OBLIQUITY = 23.43928;

function daysSinceJ2000(date) { return date.getTime() / 86400000 + 2440587.5 - 2451545.0; }

function solveKepler(M, e) {          // M, E in radians
  let E = M + e * Math.sin(M);
  for (let i = 0; i < 8; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}

function helioEcliptic(name, T) {     // T = Julian centuries since J2000; returns AU in ecliptic J2000 frame
  const [el, rate] = PLANET_ELEMENTS[name];
  const a = el[0] + rate[0] * T, e = el[1] + rate[1] * T, I = rad(el[2] + rate[2] * T);
  const L = el[3] + rate[3] * T, wbar = el[4] + rate[4] * T, node = el[5] + rate[5] * T;
  const w = rad(wbar - node), O = rad(node);
  let M = ((L - wbar) % 360 + 540) % 360 - 180;
  const E = solveKepler(rad(M), e);
  const xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(O), sO = Math.sin(O), cI = Math.cos(I), sI = Math.sin(I);
  return {
    x: (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp,
    y: (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp,
    z: (sw * sI) * xp + (cw * sI) * yp
  };
}

function eclToRaDec(x, y, z) {
  const ob = rad(OBLIQUITY);
  const xe = x, ye = y * Math.cos(ob) - z * Math.sin(ob), ze = y * Math.sin(ob) + z * Math.cos(ob);
  return { ra: (deg(Math.atan2(ye, xe)) + 360) % 360, dec: deg(Math.atan2(ze, Math.hypot(xe, ye))), dist: Math.hypot(xe, ye, ze) };
}

function moonPosition(date) {         // low-precision lunar theory (good to ~0.3°), returned in the J2000 frame like the stars
  const d = daysSinceJ2000(date);
  const precess = rad(1.3969 * d / 36525);
  const L = rad(218.316 + 13.176396 * d), M = rad(134.963 + 13.064993 * d), F = rad(93.272 + 13.229350 * d);
  const D = rad(297.850 + 12.190749 * d), Ms = rad(357.529 + 0.98560028 * d);
  const lon = -precess + L + rad(6.289) * Math.sin(M) + rad(1.274) * Math.sin(2 * D - M) + rad(0.658) * Math.sin(2 * D)
            + rad(0.214) * Math.sin(2 * M) - rad(0.186) * Math.sin(Ms) - rad(0.114) * Math.sin(2 * F);
  const lat = rad(5.128) * Math.sin(F) + rad(0.281) * Math.sin(M + F) + rad(0.278) * Math.sin(M - F) - rad(0.173) * Math.sin(F - 2 * D);
  // ecliptic of date -> equatorial
  const ob = rad(OBLIQUITY);
  const x = Math.cos(lat) * Math.cos(lon), y = Math.cos(lat) * Math.sin(lon), z = Math.sin(lat);
  const ye = y * Math.cos(ob) - z * Math.sin(ob), ze = y * Math.sin(ob) + z * Math.cos(ob);
  return { ra: (deg(Math.atan2(ye, x)) + 360) % 360, dec: deg(Math.asin(ze)), lonDeg: (deg(lon) % 360 + 360) % 360 };
}

function moonPhaseName(elong) {       // elongation of Moon east of Sun, 0..360
  const p = elong;
  if (p < 10 || p > 350) return "New Moon";
  if (p < 80) return "Waxing crescent";
  if (p < 100) return "First quarter";
  if (p < 170) return "Waxing gibbous";
  if (p < 190) return "Full Moon";
  if (p < 260) return "Waning gibbous";
  if (p < 280) return "Last quarter";
  return "Waning crescent";
}

function solarSystem(date) {
  const T = daysSinceJ2000(date) / 36525;
  const earth = helioEcliptic("Earth", T);
  const out = [];
  const sunEq = eclToRaDec(-earth.x, -earth.y, -earth.z);
  out.push({ name: "Sun", ra: sunEq.ra, dec: sunEq.dec, dist: sunEq.dist });
  for (const name of ["Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]) {
    const p = helioEcliptic(name, T);
    const g = eclToRaDec(p.x - earth.x, p.y - earth.y, p.z - earth.z);
    out.push({ name, ra: g.ra, dec: g.dec, dist: g.dist });
  }
  const m = moonPosition(date);
  const sunLon = (deg(Math.atan2(-earth.y, -earth.x)) + 360) % 360;
  const elong = ((m.lonDeg - sunLon) % 360 + 360) % 360;
  out.push({ name: "Moon", ra: m.ra, dec: m.dec, phase: moonPhaseName(elong), lit: Math.round((1 - Math.cos(rad(elong))) / 2 * 100), elong });
  return out;
}

// ===================== LOADING =====================
async function loadData() {
  try {
    const [s, l, c, n] = await Promise.all([
      fetch(DATA + "stars.6.json").then(r => r.json()),
      fetch(DATA + "constellations.lines.json").then(r => r.json()),
      fetch(DATA + "constellations.json").then(r => r.json()),
      fetch(DATA + "starnames.json").then(r => r.json()).catch(() => ({}))
    ]);
    starNames = n || {};
    stars = s.features.map(f => ({
      id: f.id,
      ra: (f.geometry.coordinates[0] + 360) % 360,
      dec: f.geometry.coordinates[1],
      mag: f.properties.mag,
      bv: parseFloat(f.properties.bv)
    }));
    lines = l.features.map(f => f.geometry.coordinates);
    conNames = c.features.map(f => ({
      name: f.properties.name || f.id,
      rank: +f.properties.rank || 3,
      ra: (f.geometry.coordinates[0] + 360) % 360,
      dec: f.geometry.coordinates[1]
    }));
    setStatus();
    buildSearchIndex();
    draw();
  } catch (e) {
    document.getElementById("status").textContent = "Couldn't load star data. Check your internet and refresh.";
  }
}

function setStatus() {
  document.getElementById("status").textContent =
    `${stars.length.toLocaleString()} real stars · sky over ${place.name} (${place.lat.toFixed(2)}°, ${place.lon.toFixed(2)}°)`;
}

function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    place = { lat: p.coords.latitude, lon: p.coords.longitude, name: "your location" };
    if (stars.length) { setStatus(); draw(); }
  }, () => {}, { timeout: 8000 });
}

// ===================== DRAWING =====================
function resize() {
  const size = canvas.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr; canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const size = canvas.clientWidth;
  if (!size) return;
  ctx.clearRect(0, 0, size, size);
  const now = currentTime();
  const lst = localSiderealDeg(now, place.lon);

  // horizon circle and compass
  const centre = project(90, 0, size);
  const R = size * 0.47 * view.scale;
  ctx.strokeStyle = "rgba(120,150,255,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(centre.x, centre.y, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "rgba(120,150,255,0.10)";
  [30, 60].forEach(a => {
    ctx.beginPath(); ctx.arc(centre.x, centre.y, R * Math.tan(rad(90 - a) / 2), 0, Math.PI * 2); ctx.stroke();
  });
  ctx.fillStyle = "#7aa2ff"; ctx.font = "600 13px Inter"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([t, az]) => {
    const p = project(-6, az, size); ctx.fillText(t, p.x, p.y);
  });

  // constellation lines
  if (document.getElementById("showLines").checked) {
    ctx.strokeStyle = "rgba(122,162,255,0.35)"; ctx.lineWidth = 1;
    for (const multi of lines) for (const seg of multi) {
      ctx.beginPath(); let started = false;
      for (const [ra, dec] of seg) {
        const h = toHorizon((ra + 360) % 360, dec, lst, place.lat);
        if (h.alt < -2) { started = false; continue; }
        const p = project(h.alt, h.az, size);
        if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }

  // stars
  drawn = [];
  const zoomBoost = Math.sqrt(view.scale);
  for (const s of (document.getElementById("showStars").checked ? stars : [])) {
    const h = toHorizon(s.ra, s.dec, lst, place.lat);
    if (h.alt < 0) continue;
    const p = project(h.alt, h.az, size);
    if (p.x < -10 || p.y < -10 || p.x > size + 10 || p.y > size + 10) continue;
    const r = Math.max(0.5, (6.5 - s.mag) * 0.55) * zoomBoost;
    const twinkle = 0.85 + 0.15 * Math.sin(Date.now() / 400 + s.id);
    ctx.globalAlpha = Math.min(1, (0.35 + (6.5 - s.mag) / 6)) * twinkle;
    ctx.fillStyle = starColour(s.bv);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    if (s.mag < 1.5) { // glow for the brightest
      ctx.globalAlpha = 0.15;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawn.push({ s, x: p.x, y: p.y, alt: h.alt, az: h.az });
  }

  // names
  if (document.getElementById("showNames").checked) {
    ctx.font = "11px Inter"; ctx.textAlign = "left";
    for (const d of drawn) {
      const nm = starNames[d.s.id] && starNames[d.s.id].name;
      if (nm && d.s.mag < 1.6 + view.scale * 0.5) {
        ctx.fillStyle = "rgba(255,211,110,0.85)"; ctx.fillText(nm, d.x + 6, d.y - 6);
      }
    }
    ctx.textAlign = "center"; ctx.font = "600 11px Inter";
    for (const c of conNames) {
      if (c.rank > 1 + Math.floor(view.scale)) continue;
      const h = toHorizon(c.ra, c.dec, lst, place.lat);
      if (h.alt < 5) continue;
      const p = project(h.alt, h.az, size);
      ctx.fillStyle = "rgba(122,162,255,0.7)"; ctx.fillText(c.name.toUpperCase(), p.x, p.y);
    }
  }

  // planets, Sun & Moon
  drawnBodies = [];
  const bodies = solarSystem(now);
  const sunBody = bodies.find(b => b.name === "Sun");
  const sunH = toHorizon(sunBody.ra, sunBody.dec, lst, place.lat);
  if (document.getElementById("showPlanets").checked) {
    const sunP = project(sunH.alt, sunH.az, size);
    for (const b of bodies) {
      const h = toHorizon(b.ra, b.dec, lst, place.lat);
      if (h.alt < 0) continue;
      const p = project(h.alt, h.az, size);
      const st = PLANET_STYLE[b.name];
      const r = st.size * Math.max(1, Math.sqrt(view.scale) * 0.9);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.2);
      g.addColorStop(0, st.colour + "aa"); g.addColorStop(1, st.colour + "00");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = st.colour; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      if (b.name === "Moon") {              // shade the unlit part toward the side away from the Sun
        const ang = Math.atan2(sunP.y - p.y, sunP.x - p.x);
        const off = 2 * r * b.lit / 100;
        ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = "rgba(6,10,26,0.88)";
        ctx.beginPath(); ctx.arc(p.x - Math.cos(ang) * off, p.y - Math.sin(ang) * off, r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (b.name === "Saturn") {
        ctx.strokeStyle = st.colour; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, r * 2.1, r * 0.7, -0.4, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = "#ffffff"; ctx.font = "600 12px Inter"; ctx.textAlign = "left";
      ctx.fillText(b.name, p.x + r + 5, p.y - r - 2);
      drawnBodies.push({ b, x: p.x, y: p.y, alt: h.alt, az: h.az, r });
    }
  }
  isDaytime = sunH.alt > -6;

  // search highlight
  if (target) {
    if (target.body) { const b = bodies.find(x => x.name === target.body); target.ra = b.ra; target.dec = b.dec; }
    const h = toHorizon(target.ra, target.dec, lst, place.lat);
    if (h.alt > -1) {
      const p = project(h.alt, h.az, size);
      const pulse = 14 + 5 * Math.sin(Date.now() / 250);
      ctx.strokeStyle = "rgba(255,211,110,0.95)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,211,110,0.35)"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, pulse + 6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#ffd36e"; ctx.font = "600 13px Inter"; ctx.textAlign = "left";
      if (!target.body || !document.getElementById("showPlanets").checked) ctx.fillText(target.label, p.x + pulse + 8, p.y + 4);
    }
  }

  document.getElementById("timeLabel").textContent =
    now.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }) +
    (isDaytime ? "  ·  ☀ Daytime (stars hidden by sunlight)" : "");
}

// ===================== INTERACTION =====================
const pointers = new Map();
let lastPinch = null, moved = false;

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
    view.x += dx; view.y += dy; draw();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) zoomAt(dist / lastPinch, (a.x + b.x) / 2, (a.y + b.y) / 2);
    lastPinch = dist; moved = true;
  }
});
function endPointer(e) {
  if (pointers.size === 1 && !moved) tapAt(e.clientX, e.clientY);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinch = null;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); lastPinch = null; });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
}, { passive: false });

function zoomAt(factor, clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left - rect.width / 2, my = clientY - rect.top - rect.height / 2;
  const newScale = Math.min(12, Math.max(0.8, view.scale * factor));
  const f = newScale / view.scale;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f;
  view.scale = newScale; draw();
}

function tapAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left, y = clientY - rect.top;
  const hitBody = drawnBodies.find(d => Math.hypot(d.x - x, d.y - y) < d.r + 10);
  if (hitBody) { showBodyInfo(hitBody.b, hitBody.alt, hitBody.az); return; }
  let best = null, bestD = 18;
  for (const d of drawn) {
    const dist = Math.hypot(d.x - x, d.y - y) - (6 - d.s.mag);
    if (dist < bestD) { bestD = dist; best = d; }
  }
  if (!best) { hideInfo(); return; }
  const s = best.s;
  const nm = (starNames[s.id] && starNames[s.id].name) || (starNames[s.id] && starNames[s.id].desig) || `HIP ${s.id}`;
  const bright = s.mag < 1 ? "one of the brightest stars in the sky" : s.mag < 3 ? "easy to see" : s.mag < 5 ? "visible from darker places" : "faint, needs a dark sky";
  document.getElementById("infoBody").innerHTML = `
    <h3>${nm}</h3>
    Brightness: magnitude ${s.mag.toFixed(2)} (${bright})<br>
    Colour: ${colourName(s.bv)}<br>
    Where to look: ${Math.round(best.alt)}° up, towards ${compass(best.az)}<br>
    <span style="color:var(--muted)">RA ${(s.ra / 15).toFixed(2)}h · Dec ${s.dec.toFixed(1)}°</span>`;
  document.getElementById("info").style.display = "block";
}
// ===================== SEARCH =====================
let target = null;          // {ra, dec, label, kind}
let searchIndex = [];       // [{key, label, ra, dec, kind, star}]

function buildSearchIndex() {
  searchIndex = [];
  const byId = new Map(stars.map(s => [String(s.id), s]));
  for (const [id, info] of Object.entries(starNames)) {
    const s = byId.get(String(id));
    if (!s || !info || !info.name) continue;
    searchIndex.push({ key: info.name.toLowerCase(), label: info.name, ra: s.ra, dec: s.dec, kind: "star", star: s });
  }
  for (const c of conNames) {
    searchIndex.push({ key: c.name.toLowerCase(), label: c.name, ra: c.ra, dec: c.dec, kind: "constellation" });
  }
  for (const name of Object.keys(PLANET_STYLE)) {
    searchIndex.push({ key: name.toLowerCase(), label: name, kind: name === "Sun" ? "star" : name === "Moon" ? "moon" : "planet", body: name });
  }
  searchIndex.sort((a, b) => a.label.localeCompare(b.label));
  const dl = document.getElementById("skyNames");
  dl.innerHTML = searchIndex.map(e => `<option value="${e.label}">${e.body ? (e.body === "Sun" ? "Our Sun" : e.body === "Moon" ? "Moon" : "Planet") : e.kind === "star" ? "Star" : "Constellation"}</option>`).join("");
}

function findEntry(q) {
  q = q.trim().toLowerCase();
  if (!q) return null;
  const exactBody = searchIndex.find(e => e.body && e.key === q);
  if (exactBody) return exactBody;
  return searchIndex.find(e => e.key === q)
      || searchIndex.find(e => e.key.startsWith(q))
      || searchIndex.find(e => e.key.includes(q));
}

function fmtTime(d) { return d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); }

function doSearch() {
  const msg = document.getElementById("searchMsg");
  if (!searchIndex.length) { msg.textContent = "Star catalogue is still loading — try again in a moment."; return; }
  const e = findEntry(document.getElementById("searchBox").value);
  if (!e) { msg.innerHTML = "No star or constellation found with that name. Try <b>Sirius</b>, <b>Orion</b> or <b>Vega</b>."; target = null; draw(); return; }
  document.getElementById("searchBox").value = e.label;
  const now = currentTime();
  const posAt = t => e.body ? solarSystem(t).find(b => b.name === e.body) : e;
  const pos = posAt(now);
  target = { ra: pos.ra, dec: pos.dec, label: e.label, kind: e.kind, body: e.body };
  const h = toHorizon(pos.ra, pos.dec, localSiderealDeg(now, place.lon), place.lat);
  const kindTxt = e.body ? (e.body === "Sun" ? "our star" : e.body === "Moon" ? "Moon" : "planet") : e.kind === "star" ? "star" : "constellation";
  if (h.alt > 0) {
    centreOn(h.alt, h.az, e.kind === "star" ? 3 : 2);
    msg.innerHTML = `<b>${e.label}</b>${e.body === "Moon" ? "" : " (" + kindTxt + ")"} is up right now — ${Math.round(h.alt)}° above the horizon, towards ${compass(h.az)}.`;
    if (e.star) showStarInfo(e.star, h.alt, h.az);
    if (e.body) showBodyInfo(pos, h.alt, h.az);
  } else {
    // look ahead up to 24 h for the next time it rises above 5°
    let rise = null;
    for (let m = 5; m <= 1440; m += 5) {
      const t = new Date(now.getTime() + m * 60000);
      const pt = posAt(t);
      if (toHorizon(pt.ra, pt.dec, localSiderealDeg(t, place.lon), place.lat).alt > 5) { rise = m; break; }
    }
    hideInfo();
    view = { scale: 1, x: 0, y: 0 };
    if (rise === null) {
      msg.innerHTML = `<b>${e.label}</b> never rises above the horizon from ${place.name} — it's too far ${e.dec < 0 ? "south" : "north"} in the sky.`;
    } else {
      const when = new Date(now.getTime() + rise * 60000);
      const canJump = minutesOffset + rise <= 720;
      msg.innerHTML = `<b>${e.label}</b> is below the horizon now. It rises around <b>${fmtTime(when)}</b>.` +
        (canJump ? ` <button id="jumpBtn">Show me then</button>` : "");
      if (canJump) document.getElementById("jumpBtn").onclick = () => {
        minutesOffset += rise + 30; document.getElementById("timeSlider").value = minutesOffset; doSearch();
      };
    }
  }
  draw();
}

function centreOn(alt, az, scale) {
  view = { scale, x: 0, y: 0 };
  const size = canvas.clientWidth;
  const p = project(alt, az, size);
  view.x = size / 2 - p.x; view.y = size / 2 - p.y;
}

function showBodyInfo(b, alt, az) {
  const st = PLANET_STYLE[b.name];
  let extra = "";
  if (b.name === "Moon") extra = `Phase: ${b.phase} (${b.lit}% lit)<br>`;
  else if (b.name === "Sun") extra = `Distance: ${(b.dist * 149.6).toFixed(1)} million km<br>`;
  else extra = `Distance from Earth: ${(b.dist * 149.6).toFixed(0)} million km<br>Light takes ${(b.dist * 8.317).toFixed(0)} minutes to reach us<br>`;
  document.getElementById("infoBody").innerHTML = `
    <h3>${b.name}</h3>
    ${st.fact}<br>
    ${extra}
    Where to look: ${Math.round(alt)}° up, towards ${compass(az)}<br>
    <span style="color:var(--muted)">RA ${(b.ra / 15).toFixed(2)}h · Dec ${b.dec.toFixed(1)}°</span>`;
  document.getElementById("info").style.display = "block";
}

function showStarInfo(s, alt, az) {
  const nm = (starNames[s.id] && starNames[s.id].name) || `HIP ${s.id}`;
  const bright = s.mag < 1 ? "one of the brightest stars in the sky" : s.mag < 3 ? "easy to see" : s.mag < 5 ? "visible from darker places" : "faint, needs a dark sky";
  document.getElementById("infoBody").innerHTML = `
    <h3>${nm}</h3>
    Brightness: magnitude ${s.mag.toFixed(2)} (${bright})<br>
    Colour: ${colourName(s.bv)}<br>
    Where to look: ${Math.round(alt)}° up, towards ${compass(az)}<br>
    <span style="color:var(--muted)">RA ${(s.ra / 15).toFixed(2)}h · Dec ${s.dec.toFixed(1)}°</span>`;
  document.getElementById("info").style.display = "block";
}

document.getElementById("searchBtn").onclick = doSearch;
document.getElementById("searchBox").addEventListener("keydown", ev => { if (ev.key === "Enter") doSearch(); });
document.getElementById("searchBox").addEventListener("change", () => { if (findEntry(document.getElementById("searchBox").value)?.label === document.getElementById("searchBox").value) doSearch(); });
document.getElementById("clearSearch").onclick = () => {
  target = null; document.getElementById("searchBox").value = "";
  document.getElementById("searchMsg").textContent = "Type a name and press Enter.";
  hideInfo(); view = { scale: 1, x: 0, y: 0 }; draw();
};

function hideInfo() { document.getElementById("info").style.display = "none"; }

document.getElementById("timeSlider").addEventListener("input", e => { minutesOffset = +e.target.value; draw(); });
document.getElementById("nowBtn").onclick = () => { minutesOffset = 0; document.getElementById("timeSlider").value = 0; draw(); };
document.getElementById("playBtn").onclick = e => { playing = !playing; e.target.textContent = playing ? "⏸ Pause" : "▶ Play"; };
// display toggles: presets via the "Show" radio buttons, any other mix via the checkboxes
const VIEW_PRESETS = {
  all:            { showStars: true,  showLines: true,  showNames: true,  showPlanets: true  },
  planets:        { showStars: false, showLines: false, showNames: false, showPlanets: true  },
  stars:          { showStars: true,  showLines: false, showNames: true,  showPlanets: false },
  constellations: { showStars: true,  showLines: true,  showNames: true,  showPlanets: false }
};
const TOGGLES = ["showStars", "showLines", "showNames", "showPlanets"];
document.querySelectorAll('input[name="viewMode"]').forEach(r => r.addEventListener("change", () => {
  const preset = VIEW_PRESETS[r.value];
  if (preset) TOGGLES.forEach(id => document.getElementById(id).checked = preset[id]);
  draw();
}));
TOGGLES.forEach(id => document.getElementById(id).addEventListener("change", () => {
  const state = Object.fromEntries(TOGGLES.map(t => [t, document.getElementById(t).checked]));
  const match = Object.entries(VIEW_PRESETS).find(([, p]) => TOGGLES.every(t => p[t] === state[t]));
  document.querySelector(`input[name="viewMode"][value="${match ? match[0] : "custom"}"]`).checked = true;
  draw();
}));
document.getElementById("resetView").onclick = () => { view = { scale: 1, x: 0, y: 0 }; draw(); };
document.getElementById("shotBtn").onclick = () => {
  const a = document.createElement("a");
  a.download = "night-sky-" + currentTime().toISOString().slice(0, 16).replace(":", "-") + ".png";
  a.href = canvas.toDataURL("image/png"); a.click();
};

// animation loop: twinkle + play mode
let lastFrame = 0;
function loop(t) {
  if (t - lastFrame > 100) {
    if (playing) {
      minutesOffset += 4;
      if (minutesOffset > 720) minutesOffset = -720;
      document.getElementById("timeSlider").value = minutesOffset;
    }
    if (stars.length) draw();
    lastFrame = t;
  }
  requestAnimationFrame(loop);
}

// ===================== NASA PICTURE OF THE DAY =====================
const dateInput = document.getElementById("apodDate");
function isoDate(d) { return d.toISOString().slice(0, 10); }
dateInput.max = isoDate(new Date());
dateInput.min = "1995-06-16";

async function fetchApod(date) {
  const url = `https://api.nasa.gov/planetary/apod?api_key=${NASA_API_KEY}&thumbs=true` + (date ? `&date=${date}` : "");
  const res = await fetch(url);
  const d = await res.json();
  if (!res.ok || d.error || d.code) throw new Error((d.error && d.error.message) || d.msg || "NASA didn't return a picture.");
  return d;
}

// What can be shown inside the page: a photo, a YouTube/Vimeo player, or a plain video file.
function mediaHtml(d) {
  const u = d.url || "";
  if (d.media_type === "image") {
    return `<a href="${d.hdurl || u}" target="_blank" rel="noopener"><img src="${u}" alt="${d.title}"></a>`;
  }
  if (/youtube\.com\/embed|player\.vimeo\.com/.test(u)) return `<iframe src="${u}" allowfullscreen></iframe>`;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(u)) return `<video src="${u}" controls playsinline style="width:100%;border-radius:10px;margin-bottom:10px"></video>`;
  if (d.thumbnail_url) {
    return `<a href="${u}" target="_blank" rel="noopener"><img src="${d.thumbnail_url}" alt="${d.title}"></a>`;
  }
  return null; // can't show it here
}

function dayBefore(iso) {
  const t = new Date(iso + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() - 1);
  return isoDate(t);
}

// NASA's APOD service sometimes returns a placeholder page ("NASA Science", NASA logo,
// "please enable JavaScript") instead of a real picture. Spot that and fall back to the NASA Image Library.
function isBrokenApod(d) {
  return !d || d.title === "NASA Science" || /enable JavaScript/i.test(d.explanation || "") || /nasa-logo/i.test(d.url || "");
}

const LIBRARY_TOPICS = ["galaxy", "nebula", "hubble", "james webb", "saturn", "jupiter", "aurora", "milky way", "star cluster", "mars surface", "moon", "supernova"];

async function loadLibraryPhoto(date) {
  const day = Math.floor(new Date(date + "T00:00:00Z").getTime() / 86400000);
  const topic = LIBRARY_TOPICS[day % LIBRARY_TOPICS.length];
  const res = await fetch(`https://images-api.nasa.gov/search?q=${encodeURIComponent(topic)}&media_type=image&page_size=100`);
  const j = await res.json();
  const items = (j.collection && j.collection.items || []).filter(it => it.links && it.links[0] && it.data && it.data[0]);
  if (!items.length) throw new Error("NASA Image Library returned no photos.");
  const it = items[(day * 7919) % items.length];
  const d = it.data[0];
  const thumb = it.links[0].href;
  const big = thumb.replace(/~(thumb|small|medium)\.jpg$/, "~large.jpg");
  const desc = (d.description || "").replace(/<[^>]+>/g, "").slice(0, 700);
  return { title: d.title, date: (d.date_created || "").slice(0, 10), center: d.center, thumb, big,
           link: `https://images.nasa.gov/details/${encodeURIComponent(d.nasa_id)}`, desc, topic };
}

async function loadApod(date) {
  const body = document.getElementById("apodBody");
  body.textContent = "Loading…";
  const wanted = date || isoDate(new Date());
  let apodProblem = "";
  try {
    let d = await fetchApod(date);
    if (!isBrokenApod(d)) {
      let media = mediaHtml(d);
      let note = "";
      // If this day's entry is a video that can't play here, step back to the most recent photo.
      if (!media) {
        const skipped = d;
        let tries = 0;
        while (!media && tries < 10) {
          d = await fetchApod(dayBefore(d.date));
          if (isBrokenApod(d)) break;
          media = mediaHtml(d);
          tries++;
        }
        note = `<div class="meta">${skipped.date}'s NASA entry is a video: <a href="${skipped.url}" target="_blank" rel="noopener" style="color:var(--accent2)">watch "${skipped.title}" on NASA's site</a>. Showing the most recent photo instead.</div>`;
      }
      if (media && !isBrokenApod(d)) {
        dateInput.value = d.date;
        const videoLink = d.media_type !== "image"
          ? `<div class="meta"><a href="${d.url}" target="_blank" rel="noopener" style="color:var(--accent2)">▶ Open the video</a></div>` : "";
        body.innerHTML = `${note}${media}${videoLink}
          <h3>${d.title}</h3>
          <div class="meta">${d.date}${d.copyright ? " · © " + d.copyright.trim() : ""}</div>
          <p>${d.explanation}</p>`;
        return;
      }
    }
    apodProblem = "NASA's Picture of the Day service isn't sending pictures right now";
  } catch (e) {
    apodProblem = "NASA's Picture of the Day service isn't responding right now";
  }
  // Fallback: a real NASA photo from the NASA Image Library, chosen by date so it changes every day
  try {
    const p = await loadLibraryPhoto(wanted);
    dateInput.value = wanted;
    body.innerHTML = `
      <div class="meta">${apodProblem}, so here is a NASA photo of the day from the
        <a href="https://images.nasa.gov" target="_blank" rel="noopener" style="color:var(--accent2)">NASA Image Library</a> instead.</div>
      <a href="${p.big}" target="_blank" rel="noopener"><img src="${p.thumb}" alt="${p.title}"></a>
      <h3>${p.title}</h3>
      <div class="meta">${p.date}${p.center ? " · NASA " + p.center : ""} · <a href="${p.link}" target="_blank" rel="noopener" style="color:var(--accent2)">details</a></div>
      <p>${p.desc}${p.desc.length >= 700 ? "…" : ""}</p>`;
  } catch (e2) {
    body.innerHTML = `<div class="err">${apodProblem}, and the NASA Image Library could not be reached either. Please try again later.</div>`;
  }
}
